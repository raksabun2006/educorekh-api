server:
  port: ${PORT:8080}

spring:
  application:
    name: educorekh
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5416/educorekh}
    username: ${DB_USERNAME:educorekh_user}
    password: ${DB_PASSWORD:qwer}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-to-a-long-random-secret-key-256-bits-minimum}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
